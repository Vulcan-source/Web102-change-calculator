
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Change Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Change Calculator</h1>
    </header>
  <main>
    <section class="card inputs">
      <h2>Payment</h2>
      <label for="amount-due">How much is owed? ($)</label>
      <input type="number" id="amount-due" min="0" step="0.01" placeholder="0.00" />
      <label for="amount-received">How much received? ($)</label>
      <input type="number" id="amount-received" min="0" step="0.01" placeholder="0.00">
      <button id="calculate-change" type="button">Calculate</button>
    </section>
    <section class="card results">
      <h2>Change Due</h2>
      <p id="message" role="alert"></p>
      <div class="grid">
      <div class="coin"><span class="label">Dollars</span><p id="dollars-output" class="value">0</p></div>
      <div class="coin"><span class="label">Quarters</span><p id="quarters-output" class="value">0</p></div>
      <div class="coin"><span class="label">Dimes</span><p id="dimes-output" class="value">0</p></div>
      <div class="coin"><span class="label">Nickels</span><p id="nickels-output" class="value">0</p></div>
      <div class="coin"><span class="label">Pennies</span><p id="pennies-output" class="value">0</p></div>  
      </div>
    </section>
  </main>
<script src="main.js"></script>
  </body>
</html>
